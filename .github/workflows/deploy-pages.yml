name: Deploy to GitHub Pages

on:
  # 每次 push 到 main 就自動部署
  push:
    branches: [main]
  # 也可在 Actions 頁面手動觸發
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只跑一個部署，新的推送會取消進行中的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整個 repo 就是靜態網站（無需 build）
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
