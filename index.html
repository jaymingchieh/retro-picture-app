<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Retro Cam · 復古相機</title>
  <meta name="description" content="韓系 Y2K 復古相機 PWA：即時拍照套上 CCD 發色、底片顆粒、漏光與日期戳記，照片全在你的裝置上處理，可安裝到手機主畫面。" />
  <meta name="theme-color" content="#ff7a7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Retro Cam" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== App ===== -->
  <div class="app" id="app">

    <!-- top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__name">RETRO<span>CAM</span></span>
      </div>
      <div class="topbar__actions">
        <label for="upload-input" class="icon-btn" id="upload-btn" aria-label="上傳照片">⬆︎ 上傳</label>
        <input type="file" id="upload-input" accept="image/*" multiple hidden />
        <button class="icon-btn" id="install-btn" hidden aria-label="安裝到主畫面">⬇︎ 安裝</button>
      </div>
    </header>

    <!-- ===== Camera view ===== -->
    <main class="viewfinder" id="viewfinder">
      <video id="video" playsinline autoplay muted></video>
      <!-- live preview canvas (filtered) -->
      <canvas id="preview" class="preview"></canvas>

      <!-- viewfinder chrome -->
      <div class="vf-frame" aria-hidden="true">
        <span class="vf-corner tl"></span><span class="vf-corner tr"></span>
        <span class="vf-corner bl"></span><span class="vf-corner br"></span>
        <span class="vf-rec">● REC</span>
        <span class="vf-date" id="vf-date">'00 00 00</span>
      </div>

      <!-- permission / status overlay -->
      <div class="vf-overlay" id="vf-overlay">
        <div class="vf-overlay__box">
          <span class="vf-overlay__icon">📷</span>
          <p id="vf-overlay-msg">點下方按鈕開啟相機</p>
          <button class="btn-primary" id="start-btn">開啟相機</button>
        </div>
      </div>

      <!-- shutter flash -->
      <div class="flash" id="flash" aria-hidden="true"></div>

      <!-- four-cut countdown + progress -->
      <div class="countdown" id="countdown" aria-hidden="true"></div>
      <div class="shot-counter" id="shot-counter" hidden>1 / 4</div>

      <!-- upload edit mode: back-to-camera -->
      <button class="upload-exit" id="upload-exit" hidden>✕ 回相機</button>
      <div class="upload-badge" id="upload-badge" hidden>編輯上傳照片</div>
    </main>

    <!-- ===== Mode toggle ===== -->
    <div class="mode-toggle" role="group" aria-label="拍攝模式">
      <button type="button" class="mode-btn is-active" data-mode="single">單張</button>
      <button type="button" class="mode-btn" data-mode="four">四格拼貼</button>
    </div>

    <!-- ===== Four-cut options (only in four mode) ===== -->
    <div class="four-opts" id="four-opts" hidden>
      <div class="four-opts__row">
        <span class="four-opts__label">版面</span>
        <div class="seg" id="layout-seg"></div>
      </div>
      <div class="four-opts__row">
        <span class="four-opts__label">相框</span>
        <div class="frames" id="frame-seg"></div>
      </div>
    </div>

    <!-- ===== Filter strip ===== -->
    <nav class="filters" id="filters" aria-label="濾鏡"></nav>

    <!-- ===== Light-leak / flare strip ===== -->
    <nav class="filters leaks-row" id="leaks" aria-label="漏光光斑">
      <span class="leaks-row__label">✨ 光斑</span>
    </nav>

    <!-- strength slider -->
    <div class="strength">
      <label for="strength">濾鏡強度</label>
      <input type="range" id="strength" min="0" max="100" value="100" />
    </div>

    <!-- ===== Controls ===== -->
    <footer class="controls">
      <button class="thumb-btn" id="gallery-btn" aria-label="相簿">
        <img id="last-thumb" alt="" />
        <span class="thumb-btn__empty" id="thumb-empty">🖼️</span>
      </button>

      <button class="shutter" id="shutter-btn" aria-label="拍照" disabled>
        <span class="shutter__ring"></span>
        <span class="shutter__core"></span>
      </button>

      <button class="flip-btn" id="flip-btn" aria-label="切換鏡頭" disabled>⟲</button>
    </footer>
  </div>

  <!-- ===== Gallery modal ===== -->
  <div class="modal" id="gallery-modal" hidden>
    <div class="modal__bar">
      <span class="modal__title">📸 相簿</span>
      <button class="icon-btn" id="gallery-close" aria-label="關閉">✕</button>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <p class="gallery-empty" id="gallery-empty">還沒有照片，快去拍一張！</p>
  </div>

  <!-- ===== Photo viewer modal ===== -->
  <div class="modal viewer" id="viewer-modal" hidden>
    <div class="modal__bar">
      <button class="icon-btn" id="viewer-back" aria-label="返回">‹ 返回</button>
      <div class="viewer__actions">
        <button class="icon-btn" id="viewer-download" aria-label="下載">💾 下載</button>
        <button class="icon-btn danger" id="viewer-delete" aria-label="刪除">🗑️ 刪除</button>
      </div>
    </div>
    <div class="viewer__stage"><img id="viewer-img" alt="檢視照片" /></div>
  </div>

  <!-- toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/db.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/leaks.js"></script>
  <script src="js/collage.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
